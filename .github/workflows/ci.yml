name: CI

on:
  push:
    branches: [main, backend]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # Тесты поднимают настоящий Postgres через testcontainers: Docker на раннере уже есть.
      - name: Check formatting and run tests
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck; test"

      # Пароль владельца схемы получает только разовый сервис migrate, сервер его не знает.
      - name: Check that the owner role is not passed to the app service
        working-directory: .
        env:
          POSTGRES_PASSWORD: ci
          DB_MIGRATION_PASSWORD: ci
          DB_PASSWORD: ci
          SITE_ORIGIN: http://localhost:8080
        run: |
          docker compose config --format json > compose.json
          jq -e '.services.app.environment | (has("DB_MIGRATION_USER") or has("DB_MIGRATION_PASSWORD")) | not' compose.json
          jq -e '.services.migrate.environment | has("DB_MIGRATION_PASSWORD") and (has("DB_PASSWORD") | not)' compose.json
          jq -e '.services.app.depends_on.migrate.condition == "service_completed_successfully"' compose.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Check stats rules
        run: npm run check

      - name: Build
        run: npm run build
