name: CI

on:
  push:
    branches: [main, backend]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # Тесты поднимают настоящий Postgres через testcontainers: Docker на раннере уже есть.
      - name: Check formatting and run tests
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck; test"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Check stats rules
        run: npm run check

      - name: Build
        run: npm run build
