services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Скопируйте .env.example в .env и задайте POSTGRES_PASSWORD}
    volumes:
      # С Postgres 18 том монтируется в /var/lib/postgresql, а не в .../data.
      - db-data:/var/lib/postgresql
    ports:
      # Только loopback: порт нужен бэкенду в dev-режиме и не должен быть виден из сети.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/tracker
      DB_USER: tracker
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Скопируйте .env.example в .env и задайте POSTGRES_PASSWORD}
    ports:
      - "${APP_PORT:-8080}:8080"
    # Минимум прав: файловая система только для чтения, без capabilities и повышения привилегий.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  db-data:
