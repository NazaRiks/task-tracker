# Один образ на миграции и сервер. Минимум прав: файловая система только для чтения, без capabilities
# и повышения привилегий.
x-app-base: &app-base
  image: task-tracker-app
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tracker
      # Суперпользователь нужен только init-скрипту и администрированию, приложение его не знает.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Скопируйте .env.example в .env и задайте пароли}
      # Читает init-скрипт, создающий роли tracker_owner и tracker_app.
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Скопируйте .env.example в .env и задайте пароли}
      DB_PASSWORD: ${DB_PASSWORD:?Скопируйте .env.example в .env и задайте пароли}
    volumes:
      # С Postgres 18 том монтируется в /var/lib/postgresql, а не в .../data.
      - db-data:/var/lib/postgresql
      # Выполняется только при инициализации пустого тома.
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Только loopback: порт нужен бэкенду в dev-режиме и не должен быть виден из сети.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      # Именно TCP: на время init-скриптов сервер слушает только unix-сокет, и проверка без -h
      # сообщила бы о готовности раньше, чем созданы роли.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d tracker"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Единственный сервис с паролем владельца схемы. Применяет миграции и завершается.
  migrate:
    <<: *app-base
    # Образ собирает сервис app. Два build с одним тегом падают на чистой машине: "already exists".
    pull_policy: never
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/tracker
      DB_MIGRATION_USER: tracker_owner
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Скопируйте .env.example в .env и задайте пароли}
    restart: "no"

  # Пароля владельца схемы здесь быть не должно: это проверяет CI.
  app:
    <<: *app-base
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://db:5432/tracker
      DB_USER: tracker_app
      DB_PASSWORD: ${DB_PASSWORD:?Скопируйте .env.example в .env и задайте пароли}
      SITE_ORIGIN: ${SITE_ORIGIN:?Скопируйте .env.example в .env и задайте SITE_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_X_FORWARDED_FOR: ${TRUST_X_FORWARDED_FOR:-false}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  db-data:
